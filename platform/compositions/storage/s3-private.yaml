---
# Composition: Secure Private S3 Bucket
# This implements the XObjectStorage API for private buckets
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: objectstorage-private
  labels:
    crossplane.io/xrd: xobjectstorages.aws.plt.intelerad.io
    provider: aws
    bucket-type: private
spec:
  compositeTypeRef:
    apiVersion: aws.plt.intelerad.io/v1alpha1
    kind: XObjectStorage

  mode: Pipeline
  pipeline:
    - step: s3-bucket
      functionRef:
        name: function-patch-and-transform
      input:
        apiVersion: pt.fn.crossplane.io/v1beta1
        kind: Resources
        patchSets: []
        resources:
          # Main S3 Bucket
          - name: s3-bucket
            base:
              apiVersion: s3.aws.upbound.io/v1beta1
              kind: Bucket
              spec:
                forProvider:
                  region: us-east-2
                  tags:
                    ManagedBy: Crossplane
                    Project: portal-kombat
                providerConfigRef:
                  name: default
                deletionPolicy: Delete
            patches:
              # Patch bucket name from claim to s3-bucket resource
              - type: FromCompositeFieldPath
                fromFieldPath: spec.parameters.bucketName
                toFieldPath: metadata.annotations[crossplane.io/external-name]
                policy:
                  toFieldPath: MergeObjects
              # Patch region from claim to s3-bucket resource
              - type: FromCompositeFieldPath
                fromFieldPath: spec.parameters.region
                toFieldPath: spec.forProvider.region
              # Patch environment tag from claim to s3-bucket resource
              - type: FromCompositeFieldPath
                fromFieldPath: spec.parameters.environment
                toFieldPath: spec.forProvider.tags.Environment
                policy:
                  fromFieldPath: Optional

          # Bucket Versioning (separate resource in UPJET)
          - name: bucket-versioning
            base:
              apiVersion: s3.aws.upbound.io/v1beta1
              kind: BucketVersioning
              spec:
                forProvider:
                  bucketSelector:
                    matchControllerRef: true
                  versioningConfiguration:
                    - status: Enabled
                providerConfigRef:
                  name: default
                deletionPolicy: Delete

          # Server-Side Encryption (separate resource in UPJET)
          - name: bucket-encryption
            base:
              apiVersion: s3.aws.upbound.io/v1beta1
              kind: BucketServerSideEncryptionConfiguration
              spec:
                forProvider:
                  bucketSelector:
                    matchControllerRef: true
                  rule:
                    - applyServerSideEncryptionByDefault:
                        - sseAlgorithm: AES256
                providerConfigRef:
                  name: default
                deletionPolicy: Delete

          # Public Access Block (separate resource in UPJET)
          - name: bucket-public-access-block
            base:
              apiVersion: s3.aws.upbound.io/v1beta1
              kind: BucketPublicAccessBlock
              spec:
                forProvider:
                  bucketSelector:
                    matchControllerRef: true
                  blockPublicAcls: true
                  blockPublicPolicy: true
                  ignorePublicAcls: true
                  restrictPublicBuckets: true
                providerConfigRef:
                  name: default
                deletionPolicy: Delete

          # Lifecycle Configuration (separate resource in UPJET)
          - name: bucket-lifecycle
            base:
              apiVersion: s3.aws.upbound.io/v1beta1
              kind: BucketLifecycleConfiguration
              spec:
                forProvider:
                  bucketSelector:
                    matchControllerRef: true
                  rule:
                    - id: cleanup-incomplete-uploads
                      status: Enabled
                      abortIncompleteMultipartUpload:
                        - daysAfterInitiation: 7
                providerConfigRef:
                  name: default
                deletionPolicy: Delete
