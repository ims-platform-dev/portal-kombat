apiVersion: aws.platform.example/v1alpha1
kind: ObjectStorage
metadata:
  name: portal-kombat-dev-example-12345
  labels:
    portal-kombat.io/environment: dev
    portal-kombat.io/purpose: general
    portal-kombat.io/managed-by: port
spec:
  parameters:
    bucketName: portal-kombat-dev-example-12345
    region: us-east-2
    versioning: true
    encryption: true
    tags:
      - key: Environment
        value: dev
      - key: ManagedBy
        value: Port
      - key: Project
        value: portal-kombat
      - key: Purpose
        value: general
      - key: CreatedBy
        value: port-self-service
