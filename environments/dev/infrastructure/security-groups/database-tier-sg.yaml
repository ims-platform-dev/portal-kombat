---
# Database Tier Security Group
#
# Database tier security group - restricted ingress from application tier only
# Use case: RDS instances, Aurora clusters, self-managed databases
apiVersion: network.platform.example/v1alpha1
kind: SecurityGroup
metadata:
  name: database-tier
  namespace: default
spec:
  parameters:
    environment: dev
    purpose: database-tier
    region: us-east-2
    vpcId: vpc-0123456789abcdef0  # Direct VPC ID
    providerConfig: dev-account

    ingressRules:
      # Allow PostgreSQL from app tier
      - protocol: tcp
        fromPort: 5432
        toPort: 5432
        sourceSecurityGroupIdSelector:
          matchLabels:
            portal-kombat.io/security-group: app-tier
        description: "Allow PostgreSQL/5432 from app-tier-sg"

      # Allow PostgreSQL from bastion
      - protocol: tcp
        fromPort: 5432
        toPort: 5432
        sourceSecurityGroupIdSelector:
          matchLabels:
            portal-kombat.io/security-group: bastion
        description: "Allow PostgreSQL/5432 from bastion-sg"

    egressRules:
      # Allow HTTPS to Internet (for updates)
      - protocol: tcp
        fromPort: 443
        toPort: 443
        cidrBlocks:
          - 0.0.0.0/0
        description: "Allow HTTPS/443 to Internet"

    tags:
      managedBy: Crossplane
      project: portal-kombat
      environment: dev
      purpose: database-tier
