---
# EKS Node Security Group
#
# EKS worker node security group - complex networking with self-references, control plane access, NodePort services
# Use case: EKS managed node groups, self-managed worker nodes
apiVersion: network.platform.example/v1alpha1
kind: SecurityGroup
metadata:
  name: eks-node
  namespace: default
spec:
  parameters:
    environment: dev
    purpose: eks-node
    region: us-east-2
    vpcIdRef:
      name: dev-vpc
    providerConfig: dev-account

    ingressRules:
      # Node-to-node communication (self-reference)
      - protocol: "-1"
        fromPort: 0
        toPort: 0
        sourceSecurityGroupId: sg-placeholder-self  # Placeholder - update after SG creation with actual ID
        description: "Allow ALL from self (node-to-node)"

      # Control plane to nodes
      - protocol: tcp
        fromPort: 443
        toPort: 443
        sourceSecurityGroupId: sg-eks-control-plane123  # Placeholder - replace with actual control plane SG ID
        description: "Allow HTTPS/443 from eks-control-plane-sg"

      # Kubelet API
      - protocol: tcp
        fromPort: 10250
        toPort: 10250
        sourceSecurityGroupId: sg-eks-control-plane123  # Placeholder - replace with actual control plane SG ID
        description: "Allow Kubelet/10250 from eks-control-plane-sg"

      # NodePort services
      - protocol: tcp
        fromPort: 30000
        toPort: 32767
        cidrBlocks:
          - 10.0.0.0/8
        description: "Allow NodePort/30000-32767 from VPC"

    egressRules:
      # Allow all outbound
      - protocol: "-1"
        fromPort: 0
        toPort: 0
        cidrBlocks:
          - 0.0.0.0/0
        description: "Allow ALL outbound"

    tags:
      managedBy: Crossplane
      project: portal-kombat
      environment: dev
      purpose: eks-node
