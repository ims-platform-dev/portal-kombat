---
# Example: Claim an EC2 instance using the platform API
apiVersion: aws.plt.intelerad.io/v1alpha1
kind: EC2Instance
metadata:
  name: portal-kombat-dev-app-server
  namespace: default
spec:
  parameters:
    region: us-east-2
    amiId: ami-083b3f53cbda7e5a4
    instanceType: t3.small
    subnetId: subnet-02ea545b58c156d69
    securityGroupIds:
      - sg-0df0ac9467804324d
    associatePublicIp: false
    rootVolumeSizeGiB: 30
    environment: dev
  writeConnectionSecretToRef:
    name: portal-kombat-dev-app-server-connection
    namespace: default
