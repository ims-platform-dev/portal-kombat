---
# EKS Cluster Claim for Portal Kombat Dev Environment
#
# This creates a fully-managed EKS cluster using Crossplane compositions.
# The composition handles:
# - IAM roles for control plane and node groups
# - EKS cluster configuration
# - Managed node group with auto-scaling
# - OIDC provider for IRSA (IAM Roles for Service Accounts)
#
# Prerequisites:
# 1. VPC and subnets must exist (private subnets recommended for nodes)
# 2. Subnets must be in at least 2 different Availability Zones
# 3. Subnets must have appropriate tags for EKS:
#    - kubernetes.io/cluster/<cluster-name>=shared
#    - kubernetes.io/role/internal-elb=1 (for private subnets with load balancers)
# 4. Provider config 'default' must be configured with appropriate IAM permissions
#
# Post-deployment steps:
# 1. Configure kubectl: aws eks update-kubeconfig --name portal-kombat-dev --region us-east-2
# 2. Verify cluster: kubectl get nodes
# 3. Install cluster add-ons (see docs/EKS-SETUP.md):
#    - AWS Load Balancer Controller
#    - EBS CSI Driver
#    - CoreDNS
#    - kube-proxy
#    - vpc-cni
#
# Security considerations:
# - Public endpoint access is enabled by default (see composition line 196)
# - For production, consider private-only access with VPN/bastion
# - Node groups run in private subnets (recommended)
# - IMDSv2 should be required on nodes (add to composition if needed)
#
apiVersion: aws.plt.intelerad.io/v1alpha1
kind: EKSCluster
metadata:
  name: portal-kombat-dev-cluster
  namespace: default
  labels:
    environment: dev
    project: portal-kombat
    managed-by: crossplane
  annotations:
    crossplane.io/external-name: portal-kombat-dev
spec:
  parameters:
    # Basic cluster configuration
    clusterName: portal-kombat-dev
    region: us-east-2
    version: "1.34"  # Kubernetes version - check AWS for latest supported version
    environment: dev

    # VPC and networking configuration
    # IMPORTANT: Replace these subnet IDs with your actual private subnet IDs
    # These should be private subnets with NAT gateway access for internet connectivity
    vpcConfig:
      subnetIds:
        # Private subnet in us-east-2a
        - subnet-096229f2100a9c761
        # Private subnet in us-east-2b
        - subnet-0b51b91e6a2de7a79
        # Optional: Add third subnet for us-east-2c for higher availability
        # - subnet-XXXXXXXXXXXXXXXXX

    # Node group configuration
    # This creates a managed node group with auto-scaling
    nodeGroupConfig:
      # Instance types - can specify multiple for Spot diversification
      instanceTypes:
        - t3.medium  # 2 vCPU, 4 GiB RAM - suitable for dev/test workloads
        # For production, consider:
        # - t3.large     # 2 vCPU, 8 GiB RAM
        # - t3.xlarge    # 4 vCPU, 16 GiB RAM
        # - m5.large     # 2 vCPU, 8 GiB RAM (better network performance)

      # Auto-scaling configuration
      desiredSize: 2  # Initial number of nodes
      minSize: 1      # Minimum nodes (consider 2 for HA in production)
      maxSize: 4      # Maximum nodes for auto-scaling

      # Additional node group options (requires composition updates):
      # diskSize: 30  # Root volume size in GB (default: 20)
      # capacityType: ON_DEMAND  # or SPOT for cost savings
      # labels:  # Kubernetes labels for node selection
      #   workload-type: general
      # taints:  # Kubernetes taints for dedicated workloads
      #   - key: dedicated
      #     value: compute
      #     effect: NoSchedule

  # Composition selector - matches the standard EKS composition
  compositionSelector:
    matchLabels:
      cluster-type: standard

  # Connection secret configuration
  # This secret will contain kubeconfig and connection details
  # Location: crossplane-system namespace (default) or specify custom namespace
  writeConnectionSecretToRef:
    name: portal-kombat-dev-cluster-connection
    # namespace: crossplane-system  # Uncomment to specify namespace

---
# Quick reference commands:
#
# Get VPC and subnet information:
# aws ec2 describe-vpcs --region us-east-2
# aws ec2 describe-subnets --filters "Name=vpc-id,Values=<YOUR_VPC_ID>" --region us-east-2
#
# Tag subnets for EKS (run for each subnet):
# aws ec2 create-tags --resources subnet-XXXXXXXXXXXXXXXXX \
#   --tags Key=kubernetes.io/cluster/portal-kombat-dev,Value=shared \
#   --region us-east-2
#
# After cluster is created, configure kubectl:
# aws eks update-kubeconfig --name portal-kombat-dev --region us-east-2
#
# Check cluster status:
# kubectl get nodes
# kubectl get pods -A
#
# Access connection secret (contains kubeconfig):
# kubectl get secret portal-kombat-dev-cluster-connection -n crossplane-system -o yaml
#
# Monitor cluster creation progress:
# kubectl describe ekscluster portal-kombat-dev-cluster
# kubectl get cluster.eks.aws.upbound.io
# kubectl get nodegroup.eks.aws.upbound.io
#
# Troubleshooting:
# - Check Crossplane events: kubectl get events -n crossplane-system --sort-by='.lastTimestamp'
# - Check provider logs: kubectl logs -n crossplane-system -l pkg.crossplane.io/provider=provider-aws-eks
# - Check IAM role: kubectl describe role.iam.aws.upbound.io
#
# See docs/EKS-SETUP.md for complete setup guide
# See platform/compositions/compute/eks-standard.yaml for composition details
