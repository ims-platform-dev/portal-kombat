---
# Example: EKS Cluster Claim
# NOTE: This is a template - you need to provide:
# 1. Existing VPC ID and subnet IDs
# 2. Or create a VPC first using Crossplane
#
# To use this:
# 1. Get your VPC and subnet IDs from AWS Console or CLI
# 2. Update the composition to include those subnet IDs
# 3. Apply this claim
#
apiVersion: aws.plt.intelerad.io/v1alpha1
kind: EKSCluster
metadata:
  name: portal-kombat-dev-cluster
  namespace: default
spec:
  parameters:
    clusterName: portal-kombat-dev
    region: us-east-2
    version: "1.34"
    environment: dev
    vpcConfig:
      subnetIds:
        - subnet-096229f2100a9c761
        - subnet-0b51b91e6a2de7a79
    nodeGroupConfig:
      instanceTypes: ["t3.medium"]
      desiredSize: 2
      minSize: 1
      maxSize: 4
  compositionSelector:
    matchLabels:
      cluster-type: standard
  writeConnectionSecretToRef:
    name: portal-kombat-dev-cluster-connection

---
# To get your VPC details, run:
# aws ec2 describe-vpcs --region us-east-2
# aws ec2 describe-subnets --filters "Name=vpc-id,Values=<YOUR_VPC_ID>" --region us-east-2
#
# Then update the composition at:
# platform/compositions/compute/eks-standard.yaml
# And add the subnet IDs to the vpcConfig section
