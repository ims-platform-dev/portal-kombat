karpenter:
  # Settings
  settings:
    clusterName: raiden-control-plane
    clusterEndpoint: https://31F74548D0C0D4910526F1FBE62C72B5.gr7.us-east-2.eks.amazonaws.com  # TODO: Get from `kubectl cluster-info`
    interruptionQueue: raiden-control-plane  # SQS queue name

  # Service Account with IRSA
  serviceAccount:
    create: true
    name: karpenter
    annotations:
      eks.amazonaws.com/role-arn: arn:aws:iam::654654563406:role/karpenter_controller_role

  # Controller configuration
  controller:
    resources:
      requests:
        cpu: 1
        memory: 1Gi
      limits:
        cpu: 2
        memory: 2Gi

    # High availability
    replicas: 2

    # Affinity for controller pods
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
          - matchExpressions:
            - key: karpenter.sh/controller
              operator: DoesNotExist
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: karpenter
            topologyKey: kubernetes.io/hostname

    # Prevent karpenter from scaling down nodes with karpenter pods
    tolerations:
    - key: CriticalAddonsOnly
      operator: Exists

  # Metrics
  metrics:
    enabled: true

  # Webhook
  webhook:
    enabled: true
    port: 8443

  # Log level
  logLevel: info
