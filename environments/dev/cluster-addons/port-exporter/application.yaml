apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dev-port-exporter
  namespace: argocd
  labels:
    environment: dev
    component: port-exporter
spec:
  project: default
  source:
    repoURL: https://port-labs.github.io/helm-charts
    chart: port-k8s-exporter
    targetRevision: 0.2.29
    helm:
      values: |
        secret:
          existingSecret: port-credentials

        portBaseUrl: "https://api.us.port.io"
        clusterName: raiden-control-plane 
        stateKey: raiden-control-plane 
        
        deleteDependentEntities: true
        createMissingRelatedEntities: true
        
        eventListener:
          type: KAFKA
          brokers: "b-3-public.production.5v06xt.c21.kafka.us-east-1.amazonaws.com:9196,b-1-public.production.5v06xt.c21.kafka.us-east-1.amazonaws.com:9196,b-2-public.production.5v06xt.c21.kafka.us-east-1.amazonaws.com:9196"
        
        extraEnv:
          - name: CLUSTER_NAME
            value: raiden-control-plane
        
        resources:
          requests:
            memory: "512Mi"
            cpu: "200m"
          limits:
            memory: "1024Mi"
            cpu: "500m"

        configMap:
          config: |
            resources:
              - kind: v1/namespaces
                selector:
                  query: '.metadata.name | IN("kube-system", "kube-public", "kube-node-lease") | not'
                port:
                  entity:
                    mappings:
                      - identifier: .metadata.name
                        title: .metadata.name
                        blueprint: '"k8sNamespace"'
                        properties:
                          creationTimestamp: .metadata.creationTimestamp
                          labels: .metadata.labels
                          phase: .status.phase
                        relations:
                          argocdCluster: '"raiden-control-plane"'
        
              - kind: apps/v1/deployments
                selector:
                  query: 'true'
                port:
                  entity:
                    mappings:
                      - identifier: .metadata.namespace + "-" + .metadata.name
                        title: .metadata.name
                        blueprint: '"k8sDeployment"'
                        properties:
                          namespace: .metadata.namespace
                          replicas: .spec.replicas
                          availableReplicas: .status.availableReplicas // 0
                          images: '[.spec.template.spec.containers[].image]'
                          creationTimestamp: .metadata.creationTimestamp
                          strategy: .spec.strategy.type
                        relations:
                          k8sNamespace: .metadata.namespace
                          argocdApplication: .metadata.labels."app.kubernetes.io/instance" // .metadata.annotations."argocd.argoproj.io/instance"
                          ecrRepositories: |
                            [.spec.template.spec.containers[].image] |
                            map(select(contains(".dkr.ecr.") and contains(".amazonaws.com/"))) |
                            map(split("/")[-1] | split(":")[0])
  destination:
    server: https://kubernetes.default.svc
    namespace: port-exporter

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
