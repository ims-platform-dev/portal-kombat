cert-manager:
  installCRDs: true

  global:
    leaderElection:
      namespace: cert-manager


  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 128Mi


  prometheus:
    enabled: true
    servicemonitor:
      enabled: true
      prometheusInstance: default


  securityContext:
    fsGroup: 1001
    runAsNonRoot: true

  webhook:
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 128Mi

  cainjector:
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 256Mi
