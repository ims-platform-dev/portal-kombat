---
# Platform Services - Critical control plane components
# ArgoCD, Crossplane + Providers, Monitoring, Cert-Manager, External-DNS, Nginx-Ingress
apiVersion: karpenter.sh/v1beta1
kind: NodePool
metadata:
  name: platform-services
spec:
  template:
    metadata:
      labels:
        workload-type: platform-services
    spec:
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        - key: kubernetes.io/os
          operator: In
          values: ["linux"]
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand"]  # On-demand only for stability
        - key: node.kubernetes.io/instance-type
          operator: In
          values:
            - m5.xlarge    # Your current standard
            - m5.2xlarge   # For heavier monitoring/crossplane loads

      nodeClassRef:
        name: default

      taints:
        - key: workload-type
          value: platform-services
          effect: NoSchedule

  limits:
    cpu: "64"
    memory: 128Gi

  disruption:
    consolidationPolicy: WhenEmpty
    consolidateAfter: 300s  # Wait 5min before consolidating
    expireAfter: Never      # Never expire platform nodes

  weight: 100  # Highest priority

---
# Default - Application workloads and general purpose
apiVersion: karpenter.sh/v1beta1
kind: NodePool
metadata:
  name: default
spec:
  template:
    metadata:
      labels:
        workload-type: general
    spec:
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        - key: kubernetes.io/os
          operator: In
          values: ["linux"]
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand", "spot"]  # Mix for cost optimization
        - key: node.kubernetes.io/instance-type
          operator: In
          values:
            - m5.large     # Smaller workloads
            - m5.xlarge    # Standard size
            - m5.2xlarge   # Larger workloads

      nodeClassRef:
        name: default

      taints: []  # No taints - accepts any workload

  limits:
    cpu: "200"
    memory: 400Gi

  disruption:
    consolidationPolicy: WhenUnderutilized
    consolidateAfter: 30s
    expireAfter: 720h  # 30 days

  weight: 10

---
# Example Deployment Tolerations/NodeSelectors
# 
# For platform services (ArgoCD, Crossplane, etc.):
# ---
# apiVersion: apps/v1
# kind: Deployment
# metadata:
#   name: argocd-server
# spec:
#   template:
#     spec:
#       nodeSelector:
#         workload-type: platform-services
#       tolerations:
#         - key: workload-type
#           operator: Equal
#           value: platform-services
#           effect: NoSchedule
#
# For general workloads (no changes needed):
# They'll naturally land on the default pool