---
# Default EC2NodeClass for general workloads
apiVersion: karpenter.k8s.aws/v1beta1
kind: EC2NodeClass
metadata:
  name: default
spec:
  # AMI Selection
  amiFamily: AL2

  # Subnet selection (use EKS cluster subnets)
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: raiden-control-plane

  # Security group selection (use EKS cluster security groups)
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: raiden-control-plane

  # IAM Instance Profile
  role: karpenter_node_role

  # User data for node bootstrapping
  userData: |
    #!/bin/bash
    /etc/eks/bootstrap.sh raiden-control-plane

  # Block device mappings
  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        volumeSize: 50Gi
        volumeType: gp3
        iops: 3000
        throughput: 125
        encrypted: true
        deleteOnTermination: true

  # Tags for created resources
  tags:
    Environment: dev
    ManagedBy: Karpenter
    Project: portal-kombat
    Cluster: raiden-control-plane

  # Metadata options
  metadataOptions:
    httpEndpoint: enabled
    httpProtocolIPv6: disabled
    httpPutResponseHopLimit: 2
    httpTokens: required
