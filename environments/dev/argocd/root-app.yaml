---
# Root Application (App of Apps) for Dev Environment
# This is the entry point that deploys everything in dev
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dev-root
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: git@github.com:ims-platform-dev/portal-kombat.git
    targetRevision: main
    path: environments/dev/argocd
    directory:
      recurse: false
      include: '{platform-apps.yaml,infrastructure-apps.yaml,workload-apps.yaml}'
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
