---
# Provider Configs Application
# Deploys DeploymentRuntimeConfigs and ProviderConfigs with IRSA
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dev-provider-configs
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"  # Deploy after platform apps (providers)
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: git@github.com:ims-platform-dev/portal-kombat.git
    targetRevision: main
    path: shared/configs/provider-configs
    directory:
      recurse: false
  destination:
    server: https://kubernetes.default.svc
    namespace: crossplane-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 3
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
