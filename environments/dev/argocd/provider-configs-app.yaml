---
# ArgoCD application for deploying Crossplane provider configs
# Manages authentication configurations for cross-account access
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dev-provider-configs
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: git@github.com:ims-platform-dev/portal-kombat.git
    targetRevision: main
    path: infra-definitions/shared/configs/provider-configs
    directory:
      include: '*.yaml'
  destination:
    server: https://kubernetes.default.svc
    namespace: crossplane-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false  # crossplane-system already exists
    retry:
      limit: 3
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
