---
# Platform Services App-of-Apps
# Deploys: ebs-csi-driver → cert-manager → external-dns → nginx-ingress → monitoring
# Each service has sync-wave ordering to ensure proper dependency handling

---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dev-k8s-ebs-csi-driver
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "5"  # Before cert-manager (storage needed first)
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: git@github.com:ims-platform-dev/portal-kombat.git
    targetRevision: main
    path: environments/dev/cluster-addons/ebs-csi-driver
    helm:
      releaseName: aws-ebs-csi-driver
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false  # kube-system already exists
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m

---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dev-k8s-cert-manager
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "10"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: git@github.com:ims-platform-dev/portal-kombat.git
    targetRevision: main
    path: environments/dev/cluster-addons/cert-manager
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m

---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dev-k8s-external-dns
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "20"  # After cert-manager
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: git@github.com:ims-platform-dev/portal-kombat.git
    targetRevision: main
    path: environments/dev/cluster-addons/external-dns
    helm:
      releaseName: dev-k8s-external-dns
      valueFiles:
        - values.yaml
      skipCrds: false
      parameters: []
  destination:
    server: https://kubernetes.default.svc
    namespace: external-dns
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m

---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dev-k8s-nginx-ingress
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "30"  # After external-dns
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: git@github.com:ims-platform-dev/portal-kombat.git
    targetRevision: main
    path: environments/dev/cluster-addons/nginx-ingress
    helm:
      releaseName: dev-k8s-nginx-ingress
      valueFiles:
        - values.yaml
      skipCrds: false
      parameters: []
  destination:
    server: https://kubernetes.default.svc
    namespace: ingress-nginx
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m

---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dev-k8s-monitoring
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "40"  # After ingress controller
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 79.4.0
    helm:
      releaseName: kube-prometheus-stack
      parameters:
        - name: grafana.service.type
          value: ClusterIP
        - name: prometheus.service.type
          value: ClusterIP
        - name: alertmanager.service.type
          value: ClusterIP
      values: |
        grafana:
          defaultDashboardsEnabled: true
          sidecar:
            datasources:
              enabled: true
              defaultDatasourceEnabled: false
          resources:
            limits:
              cpu: "1"
              memory: 2Gi
            requests:
              cpu: 100m
              memory: 1Gi
          dashboardProviders:
            dashboardproviders.yaml:
              apiVersion: 1
              providers:
              - name: default
                orgId: 1
                type: file
                disableDeletion: false
                editable: true
                options:
                  path: /var/lib/grafana/dashboards/default
          dashboards:
            default:
              argocd:
                gnetId: 14584
                revision: 1
                datasource: prometheusdatasource
              crossplane:
                gnetId: 21169
                revision: 1
                datasource: prometheusdatasource
              eks:
                gnetId: 14623
                revision: 1
                datasource: prometheusdatasource
              ekscontrolplane:
                gnetId: 21192
                revision: 1
                datasource: Prometheus
        prometheus:
          prometheusSpec:
            retention: 30d
            retentionSize: 15GB
            storageSpec:
              volumeClaimTemplate:
                spec:
                  accessModes: ["ReadWriteOnce"]
                  resources:
                    requests:
                      storage: 50Gi
          additionalServiceMonitors:
          - name: argocd
            namespaceSelector:
              matchNames:
              - argocd
            selector:
              matchLabels:
                prometheus.io/scrape: "true"
            endpoints:
            - port: metrics
          additionalPodMonitors:
          - name: crossplane
            namespaceSelector:
              matchNames:
              - crossplane-system
            selector: {}
            podMetricsEndpoints:
            - port: metrics
        alertmanager:
          alertmanagerSpec:
            storage:
              volumeClaimTemplate:
                spec:
                  accessModes: ["ReadWriteOnce"]
                  resources:
                    requests:
                      storage: 10Gi
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-prometheus-stack
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
    - group: apps
      kind: StatefulSet
      jsonPointers:
        - /spec/replicas
