---
# Platform Services App-of-Apps
# Deploys: ebs-csi-driver → cert-manager → external-dns → nginx-ingress → karpenter
# Each service has sync-wave ordering to ensure proper dependency handling

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dev-k8s-ebs-csi-driver
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "5"  # Deploy first - storage foundation
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: git@github.com:ims-platform-dev/portal-kombat.git
    targetRevision: main
    path: environments/dev/cluster-addons/ebs-csi-driver
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system  # CSI drivers typically run in kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false  # kube-system already exists
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m

---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dev-k8s-cert-manager
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "10"  # After storage
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: git@github.com:ims-platform-dev/portal-kombat.git
    targetRevision: main
    path: environments/dev/cluster-addons/cert-manager
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m

---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dev-k8s-external-dns
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "20"  # After cert-manager
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: git@github.com:ims-platform-dev/portal-kombat.git
    targetRevision: main
    path: environments/dev/cluster-addons/external-dns
  destination:
    server: https://kubernetes.default.svc
    namespace: external-dns
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m

---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dev-k8s-nginx-ingress
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "30"  # After external-dns
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: git@github.com:ims-platform-dev/portal-kombat.git
    targetRevision: main
    path: environments/dev/cluster-addons/nginx-ingress
  destination:
    server: https://kubernetes.default.svc
    namespace: ingress-nginx
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m

---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dev-k8s-karpenter
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "40"  # After nginx-ingress
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: git@github.com:ims-platform-dev/portal-kombat.git
    targetRevision: main
    path: environments/dev/cluster-addons/karpenter
  destination:
    server: https://kubernetes.default.svc
    namespace: karpenter
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  ignoreDifferences:
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      jsonPointers:
        - /webhooks/0/clientConfig/caBundle
