---
# ArgoCD Repository Secret for SSH Authentication
# Apply manually for security best practice: kubectl apply -f environments/dev/argocd/gitops-repo-secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: portal-kombat-repo
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: repository
type: Opaque
stringData:
  type: git
  url: git@github.com:intelerad/portal-kombat.git
  sshPrivateKey: |
    -----BEGIN OPENSSH PRIVATE KEY-----
    # REPLACE THIS WITH YOUR ACTUAL SSH PRIVATE KEY
    # Generate with: ssh-keygen -t ed25519 -C "argocd@portal-kombat"
    # Add public key to GitHub: Settings > Deploy keys
    -----END OPENSSH PRIVATE KEY-----
  insecure: "false"
  enableLfs: "false"
