---
# Infrastructure Claims (VPC, EKS, S3, RDS, etc.)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dev-infrastructure-claims
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: git@github.com:ims-platform-dev/portal-kombat.git
    targetRevision: main
    path: environments/dev/infrastructure
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
  # Ignore differences in Crossplane-managed fields that don't affect desired state
  ignoreDifferences:
    # Ignore all status fields (Crossplane updates these)
    - group: "*"
      kind: "*"
      jsonPointers:
        - /status
    # Ignore metadata fields added by Crossplane controllers
    - group: "*"
      kind: "*"
      jqPathExpressions:
        - '.metadata.annotations["crossplane.io/external-name"]'
        - '.metadata.annotations["crossplane.io/composition-resource-name"]'
        - '.metadata.managedFields'
    # Ignore Crossplane Composite Resource specific fields
    - group: "*.plt.intelerad.io"
      kind: "*"
      jsonPointers:
        - /spec/resourceRefs
        - /spec/claimRef
    # Ignore provider config default values
    - group: "*.aws.upbound.io"
      kind: "*"
      managedFieldsManagers:
        - crossplane
        - provider-aws-ec2
        - provider-aws-s3
        - provider-aws-rds
        - provider-aws-iam
