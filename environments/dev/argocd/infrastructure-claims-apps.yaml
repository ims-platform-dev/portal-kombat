---
# Infrastructure Claims (VPC, EKS, S3, RDS, etc.)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dev-infrastructure-claims
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: git@github.com:ims-platform-dev/portal-kombat.git
    targetRevision: main
    path: environments/dev/infrastructure
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
  # Ignore fields that Crossplane automatically adds/manages
  ignoreDifferences:
    - group: aws.plt.intelerad.io
      kind: ObjectStorage
      managedFieldsManagers:
        - crossplane
      jqPathExpressions:
        - .spec.parameters.providerConfig
        - .spec.compositionRef
        - .spec.compositionRevisionRef
        - .spec.resourceRef
        - .spec.compositeDeletePolicy
    - group: aws.plt.intelerad.io
      kind: EC2Instance
      managedFieldsManagers:
        - crossplane
      jqPathExpressions:
        - .spec.parameters.providerConfig
        - .spec.compositionRef
        - .spec.compositionRevisionRef
        - .spec.resourceRef
        - .spec.compositeDeletePolicy
---
# Shared Provider Configs
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dev-provider-configs
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: git@github.com:ims-platform-dev/portal-kombat.git
    targetRevision: main
    path: infra-definitions/shared/configs/provider-configs
    directory:
      include: '{platform-dev.yaml,aws-upbound-runtime-config.yaml}'
  destination:
    server: https://kubernetes.default.svc
    namespace: crossplane-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
