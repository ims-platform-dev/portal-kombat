name: Port.io S3 Bucket Provisioning

on:
  workflow_dispatch:
    inputs:
      port_payload:
        description: 'Port.io action payload'
        required: true
        type: string

jobs:
  provision-s3-bucket:
    name: Provision S3 Bucket via Crossplane
    runs-on: [self-hosted, linux, x64, portal-kombat]
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract payload
        id: payload
        run: |
          # Parse Port.io payload from workflow input
          PAYLOAD='${{ inputs.port_payload }}'

          # Extract fields from Port.io payload structure
          ENVIRONMENT=$(echo "$PAYLOAD" | jq -r '.payload.properties.environment')
          REQUESTOR=$(echo "$PAYLOAD" | jq -r '.trigger.by.user.email')
          PORT_RUN_ID=$(echo "$PAYLOAD" | jq -r '.context.runId')

          echo "resource_type=ObjectStorage" >> $GITHUB_OUTPUT
          echo "action=create" >> $GITHUB_OUTPUT
          echo "environment=$ENVIRONMENT" >> $GITHUB_OUTPUT
          echo "requestor=$REQUESTOR" >> $GITHUB_OUTPUT
          echo "port_run_id=$PORT_RUN_ID" >> $GITHUB_OUTPUT

      - name: Validate request
        id: validate
        run: |
          # Validate resource type
          if [ "${{ steps.payload.outputs.resource_type }}" != "ObjectStorage" ]; then
            echo "error=Invalid resource type: ${{ steps.payload.outputs.resource_type }}" >> $GITHUB_OUTPUT
            exit 1
          fi

          # Validate action
          if [ "${{ steps.payload.outputs.action }}" != "create" ]; then
            echo "error=Invalid action: ${{ steps.payload.outputs.action }}" >> $GITHUB_OUTPUT
            exit 1
          fi

          # Validate environment
          ENVIRONMENT="${{ steps.payload.outputs.environment }}"
          if [[ ! "$ENVIRONMENT" =~ ^(dev|staging|production)$ ]]; then
            echo "error=Invalid environment: $ENVIRONMENT" >> $GITHUB_OUTPUT
            exit 1
          fi

          # Extract parameters from Port.io payload
          PAYLOAD='${{ inputs.port_payload }}'
          PURPOSE=$(echo "$PAYLOAD" | jq -r '.payload.properties.purpose')
          BUCKET_NAME=$(echo "$PAYLOAD" | jq -r '.payload.properties.bucketName')
          REGION=$(echo "$PAYLOAD" | jq -r '.payload.properties.region // "us-east-2"')
          VERSIONING=$(echo "$PAYLOAD" | jq -r '.payload.properties.versioning // false')
          ENCRYPTION=$(echo "$PAYLOAD" | jq -r '.payload.properties.encryption // "AES256"')
          TEAM=$(echo "$PAYLOAD" | jq -r '.payload.properties.team')

          # Validate bucket name format
          if [[ ! "$BUCKET_NAME" =~ ^portal-kombat-[a-z0-9-]+$ ]]; then
            echo "error=Invalid bucket name format: $BUCKET_NAME" >> $GITHUB_OUTPUT
            exit 1
          fi

          # Validate purpose
          if [[ ! "$PURPOSE" =~ ^[a-z0-9-]+$ ]]; then
            echo "error=Invalid purpose format: $PURPOSE" >> $GITHUB_OUTPUT
            exit 1
          fi

          echo "validation=passed" >> $GITHUB_OUTPUT
          echo "Validation passed for bucket: $BUCKET_NAME"

      - name: Generate Crossplane YAML
        id: generate
        run: |
          # Set variables from Port.io payload
          PAYLOAD='${{ inputs.port_payload }}'
          PURPOSE=$(echo "$PAYLOAD" | jq -r '.payload.properties.purpose')
          BUCKET_NAME=$(echo "$PAYLOAD" | jq -r '.payload.properties.bucketName')
          REGION=$(echo "$PAYLOAD" | jq -r '.payload.properties.region // "us-east-2"')
          VERSIONING=$(echo "$PAYLOAD" | jq -r '.payload.properties.versioning // false')
          ENCRYPTION=$(echo "$PAYLOAD" | jq -r '.payload.properties.encryption // "AES256"')
          LIFECYCLE_POLICY=$(echo "$PAYLOAD" | jq -r '.payload.properties.lifecyclePolicy // "none"')
          PUBLIC_ACCESS=$(echo "$PAYLOAD" | jq -r '.payload.properties.publicAccess // false')
          TEAM=$(echo "$PAYLOAD" | jq -r '.payload.properties.team')
          COST_CENTER=$(echo "$PAYLOAD" | jq -r '.payload.properties.costCenter // ""')
          ENVIRONMENT="${{ steps.payload.outputs.environment }}"
          REQUESTOR="${{ steps.payload.outputs.requestor }}"

          # Generate claim name
          CLAIM_NAME="${PURPOSE}-bucket"

          # Target file path
          TARGET_DIR="environments/${ENVIRONMENT}/infrastructure/storage"
          TARGET_FILE="${TARGET_DIR}/${CLAIM_NAME}.yaml"

          # Create directory if not exists
          mkdir -p "$TARGET_DIR"

          # Generate YAML from template
          cat > "$TARGET_FILE" << EOF
          apiVersion: aws.platform.example/v1alpha1
          kind: ObjectStorage
          metadata:
            name: ${CLAIM_NAME}
            namespace: ${ENVIRONMENT}
            labels:
              environment: ${ENVIRONMENT}
              team: ${TEAM}
              purpose: ${PURPOSE}
              managed-by: crossplane
              requested-via: port-io
            annotations:
              port.io/run-id: "${{ steps.payload.outputs.port_run_id }}"
              requested-by: "${REQUESTOR}"
              requested-at: "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          spec:
            parameters:
              bucketName: ${BUCKET_NAME}
              region: ${REGION}
              versioning: ${VERSIONING}
              encryption: ${ENCRYPTION}
              lifecyclePolicy: ${LIFECYCLE_POLICY}
              publicAccess: ${PUBLIC_ACCESS}
              tags:
                Environment: ${ENVIRONMENT}
                Team: ${TEAM}
                Purpose: ${PURPOSE}
                CostCenter: ${COST_CENTER}
                ManagedBy: Crossplane
                RequestedBy: ${REQUESTOR}
                PortRunId: ${{ steps.payload.outputs.port_run_id }}
            compositionSelector:
              matchLabels:
                type: standard-s3
            writeConnectionSecretToRef:
              name: ${CLAIM_NAME}-connection
              namespace: ${ENVIRONMENT}
          EOF

          echo "file_path=${TARGET_FILE}" >> $GITHUB_OUTPUT
          echo "claim_name=${CLAIM_NAME}" >> $GITHUB_OUTPUT
          echo "Generated Crossplane YAML at: $TARGET_FILE"

      - name: Validate YAML syntax
        run: |
          # Install yq if not present
          if ! command -v yq &> /dev/null; then
            sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
            sudo chmod +x /usr/local/bin/yq
          fi

          # Validate YAML syntax
          yq eval '${{ steps.generate.outputs.file_path }}' > /dev/null
          echo "YAML syntax validation passed"

      - name: Kubectl dry-run validation
        run: |
          # Configure kubectl (assumes self-hosted runner has cluster access)
          kubectl config use-context portal-kombat-dev-raiden

          # Dry-run apply
          kubectl apply --dry-run=client -f ${{ steps.generate.outputs.file_path }}
          echo "Kubectl dry-run validation passed"

      - name: Create Git branch
        id: branch
        run: |
          # Generate branch name
          BRANCH_NAME="port-io/${{ steps.payload.outputs.environment }}/${{ steps.generate.outputs.claim_name }}"

          # Configure git
          git config user.name "Port.io Bot"
          git config user.email "port-io-bot@portal-kombat.dev"

          # Create and switch to new branch
          git checkout -b "$BRANCH_NAME"

          echo "branch_name=${BRANCH_NAME}" >> $GITHUB_OUTPUT
          echo "Created branch: $BRANCH_NAME"

      - name: Commit changes
        run: |
          # Add generated file
          git add ${{ steps.generate.outputs.file_path }}

          # Commit with metadata
          git commit -m "feat: provision S3 bucket ${{ steps.generate.outputs.claim_name }}

          Requested by: ${{ steps.payload.outputs.requestor }}
          Environment: ${{ steps.payload.outputs.environment }}
          Purpose: ${{ github.event.client_payload.parameters.purpose }}
          Port.io Run ID: ${{ steps.payload.outputs.port_run_id }}

          Generated via Port.io self-service action."

      - name: Push branch
        run: |
          git push origin ${{ steps.branch.outputs.branch_name }}
          echo "Pushed branch: ${{ steps.branch.outputs.branch_name }}"

      - name: Create Pull Request
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Determine approval requirements
          ENVIRONMENT="${{ steps.payload.outputs.environment }}"
          if [ "$ENVIRONMENT" == "dev" ]; then
            AUTO_MERGE="--auto --merge-method squash"
            REVIEWERS=""
          else
            AUTO_MERGE=""
            REVIEWERS="--reviewer platform-engineering-team"
          fi

          # Create PR
          PR_URL=$(gh pr create \
            --title "Provision S3 bucket: ${{ steps.generate.outputs.claim_name }}" \
            --body "## Infrastructure Request

          **Requested by**: ${{ steps.payload.outputs.requestor }}
          **Environment**: ${{ steps.payload.outputs.environment }}
          **Purpose**: ${{ github.event.client_payload.parameters.purpose }}
          **Port.io Run ID**: [${{ steps.payload.outputs.port_run_id }}](https://app.getport.io/runs/${{ steps.payload.outputs.port_run_id }})

          ## Bucket Configuration

          - **Bucket Name**: \`${{ github.event.client_payload.parameters.bucketName }}\`
          - **Region**: ${{ github.event.client_payload.parameters.region }}
          - **Versioning**: ${{ github.event.client_payload.parameters.versioning }}
          - **Encryption**: ${{ github.event.client_payload.parameters.encryption }}
          - **Team**: ${{ github.event.client_payload.metadata.team }}

          ## Validation Status

          - ✅ YAML syntax validated
          - ✅ kubectl dry-run passed
          - ✅ Naming conventions enforced

          ## Auto-Merge

          $(if [ \"$ENVIRONMENT\" == \"dev\" ]; then echo \"✅ Enabled (dev environment)\"; else echo \"❌ Disabled (requires manual approval)\"; fi)

          ---
          Generated via Port.io self-service action" \
            --base main \
            --head ${{ steps.branch.outputs.branch_name }} \
            $REVIEWERS \
            $AUTO_MERGE)

          echo "pr_url=${PR_URL}" >> $GITHUB_OUTPUT
          echo "Created PR: $PR_URL"

      - name: Update Port.io run status
        if: always()
        run: |
          # Determine status
          if [ "${{ job.status }}" == "success" ]; then
            STATUS="SUCCESS"
            MESSAGE="Pull request created successfully: ${{ steps.pr.outputs.pr_url }}"
          else
            STATUS="FAILURE"
            MESSAGE="Failed to create pull request. Check workflow logs for details."
          fi

          # Update Port.io run status (US API endpoint)
          curl -X PATCH "https://api.us.getport.io/v1/actions/runs/${{ steps.payload.outputs.port_run_id }}" \
            -H "Authorization: Bearer ${{ secrets.PORT_CLIENT_ID }}:${{ secrets.PORT_CLIENT_SECRET }}" \
            -H "Content-Type: application/json" \
            -d "{
              \"status\": \"${STATUS}\",
              \"message\": \"${MESSAGE}\",
              \"link\": \"${{ steps.pr.outputs.pr_url }}\"
            }"

      - name: Cleanup on failure
        if: failure()
        run: |
          # Delete branch if PR creation failed
          git push origin --delete ${{ steps.branch.outputs.branch_name }} || true
