---
# Simple Transit Gateway Example
#
# This example creates a basic Transit Gateway with standard configuration.
# Transit Gateways act as network hubs, enabling connectivity between VPCs
# and on-premises networks.
#
# Usage:
#   kubectl apply -f 01-transit-gateway.yaml
#
# Validation:
#   kubectl get transitgateway dev-hub-tgw -n crossplane-system
#   kubectl describe transitgateway dev-hub-tgw -n crossplane-system
#
apiVersion: aws.plt.intelerad.io/v1alpha1
kind: TransitGateway
metadata:
  name: dev-hub-tgw
  namespace: crossplane-system
  labels:
    # Standard label taxonomy for resource identification
    portal-kombat.io/network-component: transit-gateway
    environment: dev
    purpose: hub-router
spec:
  parameters:
    # Amazon Side ASN (Autonomous System Number)
    # - Range: 64512-65534 (private ASN) or 1-65534 (public ASN)
    # - Used for BGP routing (Phase 2 feature)
    # - Must be unique within your AWS organization
    amazonSideAsn: 64512

    # DNS Support
    # - Enables DNS hostname resolution between VPCs
    # - Required for cross-VPC service discovery
    # - Default: true
    dnsSupport: true

    # VPN ECMP Support (Equal-Cost Multi-Path)
    # - Enables load balancing across multiple VPN tunnels
    # - Improves VPN throughput and redundancy
    # - Required for Site-to-Site VPN with multiple tunnels
    # - Default: true
    vpnEcmpSupport: true

    # AWS Region
    # - Transit Gateway must be in same region as attached VPCs
    # - Phase 1 limitation: Single region only
    # - Phase 2 will support inter-region peering
    region: us-east-2

    # Resource Tags
    # - Applied to AWS Transit Gateway resource
    # - Used for cost allocation, automation, and compliance
    tags:
      # Standard tags for all Portal Kombat resources
      managedBy: Crossplane
      project: portal-kombat
      environment: dev

      # Optional: Add custom tags for your organization
      # costCenter: engineering
      # owner: platform-team
      # compliance: pci-dss

# Expected Outcome:
# - AWS Transit Gateway created in us-east-2
# - Ready to accept VPC attachments
# - DNS resolution enabled for cross-VPC communication
# - VPN ECMP enabled for multi-tunnel VPN support
#
# Next Steps:
# 1. Wait for Transit Gateway to reach "Ready" state
# 2. Attach VPCs using TransitGatewayAttachment (see 02-tgw-with-attachment.yaml)
# 3. Configure routing using TransitGatewayRouteTable (see 03-tgw-with-route-table.yaml)
