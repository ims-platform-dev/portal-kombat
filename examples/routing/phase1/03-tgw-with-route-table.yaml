---
# Transit Gateway with Route Table Example
#
# This example demonstrates:
# 1. Transit Gateway provisioning
# 2. Route table creation for traffic segmentation
# 3. Selector-based Transit Gateway binding
#
# Use Case:
# - Network segmentation and isolation
# - Separate routing domains (production, development, DMZ)
# - Controlled traffic flow between VPCs
#
# Usage:
#   kubectl apply -f 03-tgw-with-route-table.yaml
#
# Validation:
#   kubectl get transitgateway dev-hub-tgw -n crossplane-system
#   kubectl get transitgatewayroutetable dev-isolated-rt -n crossplane-system
#
apiVersion: aws.plt.intelerad.io/v1alpha1
kind: TransitGateway
metadata:
  name: dev-hub-tgw
  namespace: crossplane-system
  labels:
    # Labels used by TransitGatewayRouteTable selector below
    portal-kombat.io/network-component: transit-gateway
    environment: dev
    purpose: hub-router
spec:
  parameters:
    amazonSideAsn: 64512
    dnsSupport: true
    vpnEcmpSupport: true
    region: us-east-2
    tags:
      managedBy: Crossplane
      project: portal-kombat
      environment: dev

---
# Transit Gateway Route Table
#
# Route tables control traffic flow between VPC attachments.
# Each attachment can be associated with a different route table,
# enabling network segmentation and isolation.
#
# Common Use Cases:
# 1. Isolated Route Table: Prevents traffic between VPCs (shown here)
# 2. Shared Services Route Table: Allows access to central services
# 3. Production Route Table: Production VPCs only
# 4. Development Route Table: Development VPCs with limited access
#
apiVersion: aws.plt.intelerad.io/v1alpha1
kind: TransitGatewayRouteTable
metadata:
  name: dev-isolated-rt
  namespace: crossplane-system
  labels:
    portal-kombat.io/network-component: transit-gateway-route-table
    environment: dev
    purpose: isolated
    routing-domain: development
spec:
  parameters:
    # Transit Gateway Selection
    # - Uses label selectors to find the Transit Gateway
    # - Route table will be created within this Transit Gateway
    # - Must match a Transit Gateway with these labels
    transitGatewaySelector:
      matchLabels:
        portal-kombat.io/network-component: transit-gateway
        environment: dev

    # AWS Region
    # - Must match Transit Gateway region
    region: us-east-2

    # Resource Tags
    # - Applied to AWS Transit Gateway Route Table resource
    # - Use tags to indicate routing purpose and policy
    tags:
      managedBy: Crossplane
      project: portal-kombat
      environment: dev
      routing-domain: development
      isolation-level: strict

# Route Table Association:
#
# After creating this route table, associate VPC attachments with it:
#
# 1. Update TransitGatewayAttachment to reference this route table
# 2. Add route table association in the attachment spec
# 3. Configure static routes (Phase 1) or BGP (Phase 2)
#
# Example attachment with route table association:
#
# apiVersion: aws.plt.intelerad.io/v1alpha1
# kind: TransitGatewayAttachment
# metadata:
#   name: dev-vpc1-attachment
# spec:
#   parameters:
#     transitGatewaySelector:
#       matchLabels:
#         environment: dev
#     vpcIdSelector:
#       matchLabels:
#         environment: dev
#     transitGatewayRouteTableSelector:
#       matchLabels:
#         purpose: isolated
#     region: us-east-2

# Static Routes (Phase 1):
#
# Phase 1 supports static routes for basic routing scenarios.
# Static routes are configured in the composition and applied
# to this route table automatically.
#
# Example static route configuration:
# - Destination: 10.1.0.0/16 (VPC1 CIDR)
# - Target: VPC1 attachment
# - Purpose: Route traffic destined for VPC1 through its attachment
#
# Limitations:
# - Manual route configuration required
# - No automatic failover
# - No dynamic route updates
# - Suitable for small, stable network topologies
#
# Phase 2 Features (Coming Soon):
# - Dynamic routing with BGP
# - Automatic route propagation
# - Route priorities and preferences
# - Advanced routing policies

# Route Table Segmentation Patterns:
#
# 1. Isolated Network (Shown Here):
#    - No routes between VPCs
#    - Each VPC communicates only with Transit Gateway
#    - Use Case: Strict security requirements, compliance
#
# 2. Hub-and-Spoke:
#    - All VPCs route through central "hub" VPC
#    - Hub VPC has shared services (Active Directory, DNS)
#    - Spokes cannot communicate directly
#    - Use Case: Centralized services, inspection points
#
# 3. Full Mesh:
#    - All VPCs can communicate with each other
#    - Single route table for all attachments
#    - Use Case: Collaborative environments, microservices
#
# 4. Segmented by Environment:
#    - Separate route tables: production, staging, development
#    - Production isolated from non-production
#    - Use Case: Environment isolation, change control

# Troubleshooting Route Tables:
#
# Route Table Not Associated:
#   kubectl describe transitgatewayroutetable dev-isolated-rt -n crossplane-system
#   # Check Events section for association errors
#
# Transit Gateway Not Found:
#   kubectl get transitgateway -n crossplane-system --show-labels
#   # Verify labels match selector
#
# Routes Not Working:
#   1. Check route table has routes (static or propagated)
#   2. Verify VPC route tables point to Transit Gateway
#   3. Check security groups allow traffic
#   4. Verify network ACLs are not blocking traffic
#
# View AWS Route Table:
#   kubectl get transitgatewayroutetables.ec2.aws.crossplane.io
#   # Shows AWS managed resource details

# Expected Outcome:
# 1. Transit Gateway created in us-east-2
# 2. Route table created within Transit Gateway
# 3. Route table ready to accept attachments and routes
# 4. Network segmentation enabled
#
# Next Steps:
# 1. Wait for resources to reach "Ready" state
# 2. Associate VPC attachments with this route table
# 3. Configure static routes (Phase 1) or enable BGP (Phase 2)
# 4. Update VPC route tables to route traffic through Transit Gateway
# 5. Test connectivity between VPCs based on routing policy
#
# Additional Examples:
# - Multiple route tables: examples/routing/phase1/advanced/
# - Route table associations: examples/routing/phase1/associations/
# - Static route configuration: specs/aws-routing-composition/design.md
