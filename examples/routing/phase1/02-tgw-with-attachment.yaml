---
# Transit Gateway with VPC Attachment Example
#
# This example demonstrates:
# 1. Transit Gateway provisioning
# 2. VPC attachment using selector-based resource binding
# 3. Subnet tier selection (private subnets only)
#
# Prerequisites:
# - Existing VPC with labels:
#   - portal-kombat.io/network-component: vpc
#   - environment: dev
# - Private subnets with label: tier: private
#
# Usage:
#   kubectl apply -f 02-tgw-with-attachment.yaml
#
# Validation:
#   kubectl get transitgateway dev-hub-tgw -n crossplane-system
#   kubectl get transitgatewayattachment dev-vpc1-attachment -n crossplane-system
#
apiVersion: aws.plt.intelerad.io/v1alpha1
kind: TransitGateway
metadata:
  name: dev-hub-tgw
  namespace: crossplane-system
  labels:
    # Labels used by TransitGatewayAttachment selector below
    portal-kombat.io/network-component: transit-gateway
    environment: dev
    purpose: hub-router
spec:
  parameters:
    amazonSideAsn: 64512
    dnsSupport: true
    vpnEcmpSupport: true
    region: us-east-2
    tags:
      managedBy: Crossplane
      project: portal-kombat
      environment: dev

---
# VPC Attachment using Selector-Based Binding
#
# This attachment connects a VPC to the Transit Gateway above.
# Instead of hardcoding resource IDs, we use label selectors to
# dynamically bind resources, making the configuration more maintainable.
#
apiVersion: aws.plt.intelerad.io/v1alpha1
kind: TransitGatewayAttachment
metadata:
  name: dev-vpc1-attachment
  namespace: crossplane-system
  labels:
    portal-kombat.io/network-component: transit-gateway-attachment
    environment: dev
    vpc: vpc1
    attachment-type: vpc
spec:
  parameters:
    # Transit Gateway Selection
    # - Uses label selectors to find the Transit Gateway
    # - Matches resources with BOTH labels (AND condition)
    # - Benefits:
    #   * No hardcoded Transit Gateway IDs
    #   * Automatically binds when Transit Gateway is created
    #   * Environment isolation through labels
    transitGatewaySelector:
      matchLabels:
        portal-kombat.io/network-component: transit-gateway
        environment: dev

    # VPC Selection
    # - Uses label selectors to find the target VPC
    # - Must match a VPC created with these labels
    # - Example VPC labels:
    #   portal-kombat.io/network-component: vpc
    #   environment: dev
    vpcIdSelector:
      matchLabels:
        portal-kombat.io/network-component: vpc
        environment: dev

    # Subnet Selection
    # - Attachments require subnets in each availability zone
    # - Private subnets are recommended for Transit Gateway attachments
    # - Public subnets should be avoided (security best practice)
    # - The composition will automatically select one subnet per AZ
    # - Example subnet labels:
    #   tier: private
    #   availability-zone: us-east-2a
    subnetSelector:
      matchLabels:
        tier: private

    # AWS Region
    # - Must match Transit Gateway and VPC region
    # - Transit Gateways cannot attach VPCs across regions
    region: us-east-2

    # Optional: DNS Support
    # - Enables DNS hostname resolution for this attachment
    # - Inherits Transit Gateway DNS settings by default
    # - Can be overridden per attachment
    # dnsSupport: true

    # Optional: IPv6 Support
    # - Enables IPv6 traffic over this attachment
    # - Requires VPC and subnets to have IPv6 CIDR blocks
    # - Default: false
    # ipv6Support: false

    # Optional: Appliance Mode Support
    # - Required for stateful network appliances (firewalls)
    # - Ensures bidirectional traffic flows through same AZ
    # - Default: false
    # applianceModeSupport: false

    # Resource Tags
    # - Applied to AWS VPC attachment resource
    tags:
      managedBy: Crossplane
      project: portal-kombat
      environment: dev
      attachment-type: vpc
      # Optional: Add VPC identifier for tracking
      # vpc-name: dev-vpc1

# Selector-Based Binding Explained:
#
# Traditional Approach (Hardcoded IDs):
#   transitGatewayId: tgw-0123456789abcdef
#   vpcId: vpc-0123456789abcdef
#   subnetIds:
#     - subnet-0123456789abcdef
#     - subnet-0123456789abcdef
#
# Selector Approach (Portal Kombat):
#   transitGatewaySelector:
#     matchLabels:
#       portal-kombat.io/network-component: transit-gateway
#       environment: dev
#
# Benefits:
# 1. No manual ID management
# 2. Resources bind automatically when labels match
# 3. Environment isolation built-in
# 4. Easier to promote across environments (dev → staging → prod)
# 5. Clear resource relationships through label taxonomy
#
# Troubleshooting Selectors:
# - If attachment fails to provision, check resource labels:
#   kubectl get transitgateway -n crossplane-system --show-labels
#   kubectl get vpc -n crossplane-system --show-labels
#   kubectl get subnet -n crossplane-system --show-labels
#
# - Verify selector matches resources:
#   kubectl describe transitgatewayattachment dev-vpc1-attachment -n crossplane-system

# Expected Outcome:
# 1. Transit Gateway created in us-east-2
# 2. VPC attachment created, binding VPC to Transit Gateway
# 3. Attachment uses private subnets from all availability zones
# 4. Traffic can now flow between VPC and Transit Gateway
#
# Next Steps:
# 1. Wait for both resources to reach "Ready" state
# 2. Configure routing using TransitGatewayRouteTable
# 3. Add more VPC attachments to create hub-and-spoke topology
# 4. Configure route tables in VPCs to route traffic through Transit Gateway
