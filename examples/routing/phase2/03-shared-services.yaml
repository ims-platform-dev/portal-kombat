---
# Example 3: Shared Services VPC Pattern
# Demonstrates hub-and-spoke topology with centralized shared services
#
# This example creates:
# 1. Transit Gateway (hub)
# 2. Shared Services VPC (hub) - Contains DNS, NTP, monitoring, security services
# 3. Spoke VPC 1 (application workloads)
# 4. Spoke VPC 2 (application workloads)
# 5. Shared services route table (allows all spokes to reach services)
# 6. Spoke route tables (only reach shared services, not each other)
#
# Result: All spoke VPCs can access shared services, but spokes cannot
# communicate with each other (unless explicitly configured).
#
# Use Cases:
# - Centralized DNS resolution
# - Shared monitoring/logging infrastructure
# - Common security services (IDS/IPS, WAF)
# - Centralized Active Directory
# - Shared NAT Gateway egress

apiVersion: aws.plt.intelerad.io/v1alpha1
kind: TransitGateway
metadata:
  name: shared-services-tgw
  labels:
    portal-kombat.io/example: shared-services
    portal-kombat.io/pattern: hub-and-spoke
    portal-kombat.io/demo: "true"
spec:
  parameters:
    amazonSideAsn: 64514
    dnsSupport: true
    vpnEcmpSupport: true
    defaultRouteTableAssociation: false
    defaultRouteTablePropagation: false
    region: us-east-2
    tags:
      managedBy: Crossplane
      project: portal-kombat
      environment: multi
      example: shared-services
      pattern: hub-and-spoke
  writeConnectionSecretToRef:
    name: shared-services-tgw-connection
    namespace: crossplane-system

---
# Shared Services VPC Attachment (Hub)
apiVersion: aws.plt.intelerad.io/v1alpha1
kind: TransitGatewayAttachment
metadata:
  name: shared-services-hub-attachment
  labels:
    portal-kombat.io/example: shared-services
    portal-kombat.io/role: hub
    portal-kombat.io/tier: infrastructure
    portal-kombat.io/demo: "true"
spec:
  parameters:
    transitGatewaySelector:
      matchLabels:
        portal-kombat.io/example: shared-services
    vpcId: vpc-shared0123456789  # Replace with shared services VPC ID
    subnetIds:
      - subnet-shared012345678a0  # Replace with shared services subnet IDs
      - subnet-shared012345678a1
    dnsSupport: true
    ipv6Support: false
    applianceModeSupport: false
    region: us-east-2
    tags:
      managedBy: Crossplane
      project: portal-kombat
      environment: shared
      role: hub
      tier: infrastructure
      example: shared-services
  writeConnectionSecretToRef:
    name: shared-services-hub-attachment-connection
    namespace: crossplane-system

---
# Spoke VPC 1 Attachment
apiVersion: aws.plt.intelerad.io/v1alpha1
kind: TransitGatewayAttachment
metadata:
  name: shared-services-spoke1-attachment
  labels:
    portal-kombat.io/example: shared-services
    portal-kombat.io/role: spoke
    portal-kombat.io/spoke-id: "1"
    portal-kombat.io/tier: application
    portal-kombat.io/demo: "true"
spec:
  parameters:
    transitGatewaySelector:
      matchLabels:
        portal-kombat.io/example: shared-services
    vpcId: vpc-spoke10123456789  # Replace with spoke 1 VPC ID
    subnetIds:
      - subnet-spoke1012345678a0  # Replace with spoke 1 subnet IDs
      - subnet-spoke1012345678a1
    dnsSupport: true
    ipv6Support: false
    applianceModeSupport: false
    region: us-east-2
    tags:
      managedBy: Crossplane
      project: portal-kombat
      environment: spoke1
      role: spoke
      tier: application
      example: shared-services
  writeConnectionSecretToRef:
    name: shared-services-spoke1-attachment-connection
    namespace: crossplane-system

---
# Spoke VPC 2 Attachment
apiVersion: aws.plt.intelerad.io/v1alpha1
kind: TransitGatewayAttachment
metadata:
  name: shared-services-spoke2-attachment
  labels:
    portal-kombat.io/example: shared-services
    portal-kombat.io/role: spoke
    portal-kombat.io/spoke-id: "2"
    portal-kombat.io/tier: application
    portal-kombat.io/demo: "true"
spec:
  parameters:
    transitGatewaySelector:
      matchLabels:
        portal-kombat.io/example: shared-services
    vpcId: vpc-spoke20123456789  # Replace with spoke 2 VPC ID
    subnetIds:
      - subnet-spoke2012345678a0  # Replace with spoke 2 subnet IDs
      - subnet-spoke2012345678a1
    dnsSupport: true
    ipv6Support: false
    applianceModeSupport: false
    region: us-east-2
    tags:
      managedBy: Crossplane
      project: portal-kombat
      environment: spoke2
      role: spoke
      tier: application
      example: shared-services
  writeConnectionSecretToRef:
    name: shared-services-spoke2-attachment-connection
    namespace: crossplane-system

---
# Shared Services Route Table (Hub)
# This route table learns routes from ALL spokes, allowing bidirectional communication
apiVersion: aws.plt.intelerad.io/v1alpha1
kind: TransitGatewayRouteTable
metadata:
  name: shared-services-hub-rt
  labels:
    portal-kombat.io/example: shared-services
    portal-kombat.io/role: hub
    portal-kombat.io/demo: "true"
spec:
  parameters:
    transitGatewaySelector:
      matchLabels:
        portal-kombat.io/example: shared-services
    # Route propagations: Hub learns routes from all spokes
    routePropagations:
      - attachmentSelector:
          matchLabels:
            portal-kombat.io/example: shared-services
            portal-kombat.io/role: spoke
            portal-kombat.io/spoke-id: "1"
      - attachmentSelector:
          matchLabels:
            portal-kombat.io/example: shared-services
            portal-kombat.io/role: spoke
            portal-kombat.io/spoke-id: "2"
    region: us-east-2
    tags:
      managedBy: Crossplane
      project: portal-kombat
      environment: shared
      role: hub
      example: shared-services
      purpose: bidirectional-hub-spoke
  writeConnectionSecretToRef:
    name: shared-services-hub-rt-connection
    namespace: crossplane-system

---
# Spoke Route Table (Spokes Only Reach Hub)
# Single route table for all spokes - only learns routes from shared services hub
apiVersion: aws.plt.intelerad.io/v1alpha1
kind: TransitGatewayRouteTable
metadata:
  name: shared-services-spoke-rt
  labels:
    portal-kombat.io/example: shared-services
    portal-kombat.io/role: spoke
    portal-kombat.io/demo: "true"
spec:
  parameters:
    transitGatewaySelector:
      matchLabels:
        portal-kombat.io/example: shared-services
    # Route propagations: Spokes ONLY learn routes from hub (shared services)
    routePropagations:
      - attachmentSelector:
          matchLabels:
            portal-kombat.io/example: shared-services
            portal-kombat.io/role: hub
    region: us-east-2
    tags:
      managedBy: Crossplane
      project: portal-kombat
      environment: spoke
      role: spoke
      example: shared-services
      purpose: spoke-to-hub-only
  writeConnectionSecretToRef:
    name: shared-services-spoke-rt-connection
    namespace: crossplane-system

---
# Route Table Association Notes:
#
# To complete this configuration, associate route tables with attachments:
#
# 1. Hub attachment (shared-services-hub-attachment):
#    Add to spec.parameters:
#      routeTableIds:
#        - <shared-services-hub-rt-id>
#
# 2. Spoke 1 attachment (shared-services-spoke1-attachment):
#    Add to spec.parameters:
#      routeTableIds:
#        - <shared-services-spoke-rt-id>
#
# 3. Spoke 2 attachment (shared-services-spoke2-attachment):
#    Add to spec.parameters:
#      routeTableIds:
#        - <shared-services-spoke-rt-id>
#
# This creates the associations that enforce the routing policy.

---
# Traffic Flow Summary:
#
# ✅ Spoke 1 → Shared Services Hub: ALLOWED (via spoke-rt propagation)
# ✅ Spoke 2 → Shared Services Hub: ALLOWED (via spoke-rt propagation)
# ✅ Shared Services Hub → Spoke 1: ALLOWED (via hub-rt propagation)
# ✅ Shared Services Hub → Spoke 2: ALLOWED (via hub-rt propagation)
# ❌ Spoke 1 → Spoke 2: BLOCKED (no route exists in spoke-rt)
# ❌ Spoke 2 → Spoke 1: BLOCKED (no route exists in spoke-rt)
#
# To enable spoke-to-spoke communication, add spoke propagations to spoke-rt:
#   routePropagations:
#     - attachmentSelector:
#         matchLabels:
#           portal-kombat.io/role: hub
#     - attachmentSelector:
#         matchLabels:
#           portal-kombat.io/role: spoke

---
# Verification Commands:
#
# 1. Check all resources:
#    kubectl get transitgateway,transitgatewayattachment,transitgatewayroutetable \
#      -l portal-kombat.io/example=shared-services
#
# 2. Verify hub route table (should have routes to all spokes):
#    kubectl describe transitgatewayroutetable shared-services-hub-rt
#    # Should show spoke1 and spoke2 in propagatedAttachments[]
#
# 3. Verify spoke route table (should only have routes to hub):
#    kubectl describe transitgatewayroutetable shared-services-spoke-rt
#    # Should show ONLY hub attachment in propagatedAttachments[]
#
# 4. Check route table associations:
#    kubectl describe transitgatewayattachment shared-services-hub-attachment
#    kubectl describe transitgatewayattachment shared-services-spoke1-attachment
#    # Should show associatedRouteTableIds[] in status
#
# 5. Verify in AWS - Hub routes (should see spoke VPC CIDRs):
#    aws ec2 search-transit-gateway-routes \
#      --transit-gateway-route-table-id <hub-rt-id> \
#      --filters "Name=type,Values=propagated" \
#      --region us-east-2
#
# 6. Verify in AWS - Spoke routes (should see only hub VPC CIDR):
#    aws ec2 search-transit-gateway-routes \
#      --transit-gateway-route-table-id <spoke-rt-id> \
#      --filters "Name=type,Values=propagated" \
#      --region us-east-2
#
# 7. Test connectivity:
#    # From spoke1, test reaching shared services (should succeed)
#    # From spoke1, test reaching spoke2 (should fail)
