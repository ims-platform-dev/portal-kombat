              - type: FromCompositeFieldPath
                fromFieldPath: spec.parameters.publicSubnets[2].az
                toFieldPath: spec.forProvider.availabilityZone
                policy:
                  fromFieldPath: Required
              - type: FromCompositeFieldPath
                fromFieldPath: spec.parameters.publicSubnets[2].mapPublicIpOnLaunch
                toFieldPath: spec.forProvider.mapPublicIpOnLaunch
                policy:
                  fromFieldPath: Optional
              - type: FromCompositeFieldPath
                fromFieldPath: spec.parameters.publicSubnets[2].name
                toFieldPath: spec.forProvider.tags.Name
                policy:
                  fromFieldPath: Required
              - type: ToCompositeFieldPath
                fromFieldPath: status.atProvider.id
                toFieldPath: status.publicSubnets[2].id
            base:
              apiVersion: ec2.aws.upbound.io/v1beta1
              kind: Subnet
              metadata:
                labels:
                  portal-kombat.io/network-component: subnet
                  portal-kombat.io/network-tier: public
              spec:
