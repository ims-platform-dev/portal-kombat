---
# Composition: Standard AWS VPC core resources
# Implements the XVPCNetwork XRD with baseline VPC, tagging, and internet gateway wiring
# NOTE: NAT gateways incur additional hourly and data transfer charges—enable only when private workloads require outbound internet access.
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: vpc-standard
  labels:
    crossplane.io/xrd: xvpcnetworks.aws.plt.intelerad.io
    provider: aws
    network-layer: core
spec:
  compositeTypeRef:
    apiVersion: aws.plt.intelerad.io/v1alpha1
    kind: XVPCNetwork
  mode: Pipeline
  pipeline:
    - step: vpc-core
      functionRef:
        name: function-patch-and-transform
      input:
        apiVersion: pt.fn.crossplane.io/v1beta1
        kind: Resources
        patchSets:
          - name: provider-config
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: spec.parameters.providerConfig
                toFieldPath: spec.providerConfigRef.name
                policy:
                  fromFieldPath: Optional
          - name: region
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: spec.parameters.region
                toFieldPath: spec.forProvider.region
                policy:
                  fromFieldPath: Optional
          - name: standard-tags
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: spec.parameters.tags.managedBy
                toFieldPath: spec.forProvider.tags.ManagedBy
              - type: FromCompositeFieldPath
                fromFieldPath: spec.parameters.tags.project
                toFieldPath: spec.forProvider.tags.Project
              - type: FromCompositeFieldPath
                fromFieldPath: spec.parameters.tags.environment
                toFieldPath: spec.forProvider.tags.Environment
              - type: FromCompositeFieldPath
                fromFieldPath: spec.parameters.tags.additional
                toFieldPath: spec.forProvider.tags
                policy:
                  fromFieldPath: Optional
                  toFieldPath: MergeObjects
        resources:
          - name: vpc
            patches:
              # PatchSets first (these propagate provider-config, region, and tags)
              - type: PatchSet
                patchSetName: provider-config
              - type: PatchSet
                patchSetName: region
              - type: PatchSet
                patchSetName: standard-tags
              # Then individual FromCompositeFieldPath patches
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: metadata.labels[portal-kombat.io/network-claim]
              # Propagate claim labels to managed resource for selector-based binding
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.labels
                toFieldPath: metadata.labels
                policy:
                  toFieldPath: MergeObjects
              - type: FromCompositeFieldPath
                fromFieldPath: spec.parameters.vpcCidr
                toFieldPath: spec.forProvider.cidrBlock
              - type: FromCompositeFieldPath
                fromFieldPath: spec.writeConnectionSecretToRef.name
                toFieldPath: spec.writeConnectionSecretToRef.name
                policy:
                  fromFieldPath: Optional
              - type: FromCompositeFieldPath
                fromFieldPath: spec.writeConnectionSecretToRef.namespace
                toFieldPath: spec.writeConnectionSecretToRef.namespace
                policy:
                  fromFieldPath: Optional
              - type: ToCompositeFieldPath
                fromFieldPath: status.atProvider.id
                toFieldPath: status.vpcId
              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: status.publicSubnets[0].id
                    - fromFieldPath: status.publicSubnets[1].id
                    - fromFieldPath: status.publicSubnets[2].id
                  strategy: string
                  string:
                    fmt: "%s,%s,%s"
                toFieldPath: metadata.annotations[portal-kombat.io/public-subnet-ids]
                policy:
                  fromFieldPath: Optional
                  toFieldPath: MergeObjects
              - type: ToCompositeFieldPath
                fromFieldPath: metadata.annotations[portal-kombat.io/public-subnet-ids]
                toFieldPath: status.publicSubnetIdsCsv
              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: status.privateSubnets[0].id
                    - fromFieldPath: status.privateSubnets[1].id
                    - fromFieldPath: status.privateSubnets[2].id
                  strategy: string
                  string:
                    fmt: "%s,%s,%s"
                toFieldPath: metadata.annotations[portal-kombat.io/private-subnet-ids]
                policy:
                  fromFieldPath: Optional
                  toFieldPath: MergeObjects
              - type: ToCompositeFieldPath
                fromFieldPath: metadata.annotations[portal-kombat.io/private-subnet-ids]
                toFieldPath: status.privateSubnetIdsCsv
              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: status.publicRouteTables[0].id
                    - fromFieldPath: status.publicRouteTables[1].id
                    - fromFieldPath: status.publicRouteTables[2].id
                  strategy: string
                  string:
                    fmt: "%s,%s,%s"
                toFieldPath: metadata.annotations[portal-kombat.io/public-route-table-ids]
                policy:
                  fromFieldPath: Optional
                  toFieldPath: MergeObjects
              - type: ToCompositeFieldPath
                fromFieldPath: metadata.annotations[portal-kombat.io/public-route-table-ids]
                toFieldPath: status.publicRouteTableIdsCsv
              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: status.privateRouteTables[0].id
                    - fromFieldPath: status.privateRouteTables[1].id
                    - fromFieldPath: status.privateRouteTables[2].id
                  strategy: string
                  string:
                    fmt: "%s,%s,%s"
                toFieldPath: metadata.annotations[portal-kombat.io/private-route-table-ids]
                policy:
                  fromFieldPath: Optional
                  toFieldPath: MergeObjects
              - type: ToCompositeFieldPath
                fromFieldPath: metadata.annotations[portal-kombat.io/private-route-table-ids]
                toFieldPath: status.privateRouteTableIdsCsv
            connectionDetails:
              - name: vpcId
                type: FromFieldPath
                fromFieldPath: status.atProvider.id
              - name: publicSubnetIds
                type: FromFieldPath
                fromFieldPath: metadata.annotations[portal-kombat.io/public-subnet-ids]
              - name: privateSubnetIds
                type: FromFieldPath
                fromFieldPath: metadata.annotations[portal-kombat.io/private-subnet-ids]
              - name: publicRouteTableIds
                type: FromFieldPath
                fromFieldPath: metadata.annotations[portal-kombat.io/public-route-table-ids]
              - name: privateRouteTableIds
                type: FromFieldPath
                fromFieldPath: metadata.annotations[portal-kombat.io/private-route-table-ids]
          - name: internet-gateway
            patches:
              - type: PatchSet
                patchSetName: provider-config
              - type: PatchSet
                patchSetName: region
              - type: PatchSet
                patchSetName: standard-tags
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: metadata.labels[portal-kombat.io/network-claim]
              - type: FromCompositeFieldPath
                fromFieldPath: spec.writeConnectionSecretToRef.name
                toFieldPath: spec.writeConnectionSecretToRef.name
                policy:
                  fromFieldPath: Optional
              - type: FromCompositeFieldPath
                fromFieldPath: spec.writeConnectionSecretToRef.namespace
                toFieldPath: spec.writeConnectionSecretToRef.namespace
                policy:
                  fromFieldPath: Optional
              - type: ToCompositeFieldPath
                fromFieldPath: status.atProvider.id
                toFieldPath: status.internetGatewayId
            base:
              apiVersion: ec2.aws.upbound.io/v1beta1
              kind: InternetGateway
              metadata:
                labels:
                  portal-kombat.io/network-component: internet-gateway
              spec:
                providerConfigRef:
                  name: default
                forProvider:
                  region: us-east-2
                  tags:
                    ManagedBy: Crossplane
                    Project: portal-kombat
                    Environment: dev
                  vpcIdSelector:
                    matchControllerRef: true
                    matchLabels:
                      portal-kombat.io/network-component: vpc
                deletionPolicy: Delete
            connectionDetails:
              - name: internetGatewayId
                type: FromFieldPath
                fromFieldPath: status.atProvider.id
          - name: public-subnet-0
            patches:
              - type: PatchSet
                patchSetName: provider-config
              - type: PatchSet
                patchSetName: region
              - type: PatchSet
                patchSetName: standard-tags
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: metadata.labels[portal-kombat.io/network-claim]
              - type: FromCompositeFieldPath
                fromFieldPath: spec.parameters.publicSubnets[0].name
                toFieldPath: metadata.annotations[crossplane.io/external-name]
                policy:
                  fromFieldPath: Required
              - type: FromCompositeFieldPath
                fromFieldPath: spec.parameters.publicSubnets[0].name
                toFieldPath: metadata.labels[portal-kombat.io/network-subnet-name]
                policy:
                  fromFieldPath: Required
              - type: FromCompositeFieldPath
                fromFieldPath: spec.parameters.publicSubnets[0].cidr
                toFieldPath: spec.forProvider.cidrBlock
                policy:
                  fromFieldPath: Required
              - type: FromCompositeFieldPath
                fromFieldPath: spec.parameters.publicSubnets[0].az
                toFieldPath: spec.forProvider.availabilityZone
                policy:
                  fromFieldPath: Required
              - type: FromCompositeFieldPath
                fromFieldPath: spec.parameters.publicSubnets[0].mapPublicIpOnLaunch
                toFieldPath: spec.forProvider.mapPublicIpOnLaunch
                policy:
                  fromFieldPath: Optional
              - type: FromCompositeFieldPath
                fromFieldPath: spec.parameters.publicSubnets[0].name
                toFieldPath: spec.forProvider.tags.Name
                policy:
                  fromFieldPath: Required
              - type: ToCompositeFieldPath
                fromFieldPath: status.atProvider.id
                toFieldPath: status.publicSubnets[0].id
            base:
              apiVersion: ec2.aws.upbound.io/v1beta1
              kind: Subnet
              metadata:
                labels:
                  portal-kombat.io/network-component: subnet
                  portal-kombat.io/network-tier: public
              spec:
                providerConfigRef:
                  name: default
                forProvider:
                  region: us-east-2
                  mapPublicIpOnLaunch: true
                  tags:
                    ManagedBy: Crossplane
                    Project: portal-kombat
                    Environment: dev
                  vpcIdSelector:
                    matchControllerRef: true
                    matchLabels:
                      portal-kombat.io/network-component: vpc
                deletionPolicy: Delete
          - name: public-subnet-1
            patches:
              - type: PatchSet
                patchSetName: provider-config
              - type: PatchSet
                patchSetName: region
              - type: PatchSet
                patchSetName: standard-tags
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: metadata.labels[portal-kombat.io/network-claim]
              - type: FromCompositeFieldPath
                fromFieldPath: spec.parameters.publicSubnets[1].name
                toFieldPath: metadata.annotations[crossplane.io/external-name]
                policy:
                  fromFieldPath: Required
              - type: FromCompositeFieldPath
                fromFieldPath: spec.parameters.publicSubnets[1].name
                toFieldPath: metadata.labels[portal-kombat.io/network-subnet-name]
                policy:
                  fromFieldPath: Required
              - type: FromCompositeFieldPath
                fromFieldPath: spec.parameters.publicSubnets[1].cidr
                toFieldPath: spec.forProvider.cidrBlock
                policy:
                  fromFieldPath: Required
              - type: FromCompositeFieldPath
                fromFieldPath: spec.parameters.publicSubnets[1].az
                toFieldPath: spec.forProvider.availabilityZone
                policy:
                  fromFieldPath: Required
              - type: FromCompositeFieldPath
                fromFieldPath: spec.parameters.publicSubnets[1].mapPublicIpOnLaunch
                toFieldPath: spec.forProvider.mapPublicIpOnLaunch
                policy:
                  fromFieldPath: Optional
              - type: FromCompositeFieldPath
                fromFieldPath: spec.parameters.publicSubnets[1].name
                toFieldPath: spec.forProvider.tags.Name
                policy:
                  fromFieldPath: Required
              - type: ToCompositeFieldPath
                fromFieldPath: status.atProvider.id
                toFieldPath: status.publicSubnets[1].id
            base:
              apiVersion: ec2.aws.upbound.io/v1beta1
              kind: Subnet
              metadata:
                labels:
                  portal-kombat.io/network-component: subnet
                  portal-kombat.io/network-tier: public
              spec:
                providerConfigRef:
                  name: default
                forProvider:
                  region: us-east-2
                  mapPublicIpOnLaunch: true
                  tags:
                    ManagedBy: Crossplane
                    Project: portal-kombat
                    Environment: dev
                  vpcIdSelector:
                    matchControllerRef: true
                    matchLabels:
                      portal-kombat.io/network-component: vpc
                deletionPolicy: Delete
          - name: public-subnet-2
            patches:
              - type: PatchSet
                patchSetName: provider-config
              - type: PatchSet
                patchSetName: region
              - type: PatchSet
                patchSetName: standard-tags
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: metadata.labels[portal-kombat.io/network-claim]
              - type: FromCompositeFieldPath
                fromFieldPath: spec.parameters.publicSubnets[2].name
                toFieldPath: metadata.annotations[crossplane.io/external-name]
                policy:
                  fromFieldPath: Required
              - type: FromCompositeFieldPath
                fromFieldPath: spec.parameters.publicSubnets[2].name
