              kind: Subnet
              metadata:
                labels:
                  portal-kombat.io/network-component: subnet
                  portal-kombat.io/network-tier: private
              spec:
                providerConfigRef:
                  name: default
                forProvider:
                  region: us-east-2
                  mapPublicIpOnLaunch: false
                  tags:
                    ManagedBy: Crossplane
                    Project: portal-kombat
                    Environment: dev
                  vpcIdSelector:
                    matchControllerRef: true
                    matchLabels:
                      portal-kombat.io/network-component: vpc
                deletionPolicy: Delete
          - name: public-route-table-0
            patches:
              - type: PatchSet
                patchSetName: provider-config
              - type: PatchSet
                patchSetName: region
              - type: PatchSet
                patchSetName: standard-tags
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: metadata.labels[portal-kombat.io/network-claim]
              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: spec.parameters.publicSubnets[0].name
                  strategy: string
                  string:
                    fmt: "%s-public-rt"
                toFieldPath: metadata.labels[portal-kombat.io/network-route-table-name]
                policy:
                  fromFieldPath: Required
              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: spec.parameters.publicSubnets[0].name
                  strategy: string
                  string:
                    fmt: "%s-public-rt"
                toFieldPath: spec.forProvider.tags.Name
                policy:
                  fromFieldPath: Required
              - type: ToCompositeFieldPath
                fromFieldPath: status.atProvider.id
                toFieldPath: status.publicRouteTables[0].id
            base:
              apiVersion: ec2.aws.upbound.io/v1beta1
              kind: RouteTable
              metadata:
                labels:
                  portal-kombat.io/network-component: route-table
                  portal-kombat.io/network-tier: public
              spec:
                providerConfigRef:
                  name: default
                forProvider:
