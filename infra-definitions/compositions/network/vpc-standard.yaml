              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: spec.parameters.publicSubnets[0].name
                  strategy: string
                  string:
                    fmt: "%s-public-rt"
                toFieldPath: spec.forProvider.routeTableIdSelector.matchLabels[portal-kombat.io/network-route-table-name]
                policy:
                  fromFieldPath: Required
            base:
              apiVersion: ec2.aws.upbound.io/v1beta1
              kind: Route
              metadata:
                labels:
                  portal-kombat.io/network-component: route
                  portal-kombat.io/network-tier: public
              spec:
                providerConfigRef:
                  name: default
                forProvider:
                  region: us-east-2
                  destinationCidrBlock: 0.0.0.0/0
                  gatewayIdSelector:
                    matchControllerRef: true
                    matchLabels:
                      portal-kombat.io/network-component: internet-gateway
                  routeTableIdSelector:
                    matchControllerRef: true
                    matchLabels:
                      portal-kombat.io/network-route-table-name: placeholder
                deletionPolicy: Delete
          - name: public-route-table-association-0
            patches:
              - type: PatchSet
                patchSetName: provider-config
              - type: PatchSet
                patchSetName: region
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: metadata.labels[portal-kombat.io/network-claim]
              - type: CombineFromComposite
