              - type: FromCompositeFieldPath
                fromFieldPath: spec.parameters.publicSubnets[0].name
                toFieldPath: spec.forProvider.subnetIdSelector.matchLabels[portal-kombat.io/network-subnet-name]
                policy:
                  fromFieldPath: Required
            base:
              apiVersion: ec2.aws.upbound.io/v1beta1
              kind: RouteTableAssociation
              metadata:
                labels:
                  portal-kombat.io/network-component: route-table-association
                  portal-kombat.io/network-tier: public
              spec:
                providerConfigRef:
                  name: default
