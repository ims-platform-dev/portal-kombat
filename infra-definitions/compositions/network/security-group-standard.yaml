---
# Security Group Composition
#
# Overview: Creates AWS Security Group with configurable ingress/egress rules
# Naming Pattern: {environment}-{purpose}-sg
# Rule Limits: Maximum 20 ingress + 20 egress rules per security group
# Connection Secret: Exposes securityGroupId, securityGroupArn, vpcId
# YAML Array Limitation: Uses pre-defined rule slots (0-19) with Optional policy to skip unused slots

apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: security-group-standard
  labels:
    crossplane.io/xrd: xsecuritygroups.network.platform.example
    provider: aws
spec:
  compositeTypeRef:
    apiVersion: network.platform.example/v1alpha1
    kind: XSecurityGroup

  mode: Pipeline

  pipeline:
    - step: patch-and-transform
      functionRef:
        name: function-patch-and-transform
      input:
        apiVersion: pt.fn.crossplane.io/v1beta1
        kind: Resources

        patchSets:
          - name: provider-config
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: spec.parameters.providerConfig
                toFieldPath: spec.providerConfigRef.name

          - name: region
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: spec.parameters.region
                toFieldPath: spec.forProvider.region

          - name: standard-tags
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: spec.parameters.tags
                toFieldPath: spec.forProvider.tags
                policy:
                  toFieldPath: MergeObjects
              - type: FromCompositeFieldPath
                fromFieldPath: spec.parameters.environment
                toFieldPath: spec.forProvider.tags[Environment]
                transforms:
                  - type: map
                    map:
                      dev: 'dev'
                      staging: 'staging'
                      prod: 'prod'
              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: metadata.name
                  strategy: string
                  string:
                    fmt: 'Crossplane'
                toFieldPath: spec.forProvider.tags[ManagedBy]
              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: metadata.name
                  strategy: string
                  string:
                    fmt: 'portal-kombat'
                toFieldPath: spec.forProvider.tags[Project]

        resources:
          # Main SecurityGroup resource
          - name: security-group
            base:
              apiVersion: ec2.aws.upbound.io/v1beta1
              kind: SecurityGroup
              spec:
                forProvider:
                  description: "Managed by Crossplane"
            patches:
              # Generate name from environment and purpose
              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: spec.parameters.environment
                    - fromFieldPath: spec.parameters.purpose
                  strategy: string
                  string:
                    fmt: '%s-%s-sg'
                toFieldPath: spec.forProvider.name

              # VPC ID direct mapping
              - type: FromCompositeFieldPath
                fromFieldPath: spec.parameters.vpcId
                toFieldPath: spec.forProvider.vpcId
                policy:
                  fromFieldPath: Optional

              # VPC ID from claim reference (match by Crossplane claim-name label)
              - type: FromCompositeFieldPath
                fromFieldPath: spec.parameters.vpcIdRef.name
                toFieldPath: spec.forProvider.vpcIdSelector.matchLabels[crossplane.io/claim-name]
                policy:
                  fromFieldPath: Optional

              # Description with default transform
              - type: FromCompositeFieldPath
                fromFieldPath: spec.parameters.sgDescription
                toFieldPath: spec.forProvider.description
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s"
                policy:
                  fromFieldPath: Optional

              # Apply PatchSets
              - type: PatchSet
                patchSetName: provider-config
              - type: PatchSet
                patchSetName: region
              - type: PatchSet
                patchSetName: standard-tags

              # Patch status fields to composite
              - type: ToCompositeFieldPath
                fromFieldPath: status.atProvider.id
                toFieldPath: status.securityGroupId
              - type: ToCompositeFieldPath
                fromFieldPath: status.atProvider.arn
                toFieldPath: status.securityGroupArn
              - type: ToCompositeFieldPath
                fromFieldPath: status.atProvider.vpcId
                toFieldPath: status.vpcId

              # Note: Rule counts (ingressRuleCount, egressRuleCount) are not directly patchable
              # Limitation: Crossplane function-patch-and-transform does not support array length calculation
              # Workaround: Counts are implicitly derived from number of non-empty rules in claim spec
              # Individual rule IDs not exposed in status due to Crossplane array indexing constraints with ToCompositeFieldPath
              # For observability: Use kubectl to inspect individual SecurityGroupRule managed resources
              # For production monitoring: Query AWS API directly if individual rule IDs or detailed counts needed

            # Connection details for secret
            connectionDetails:
              - name: securityGroupId
                type: FromFieldPath
                fromFieldPath: status.atProvider.id
              - name: securityGroupArn
                type: FromFieldPath
                fromFieldPath: status.atProvider.arn
              - name: vpcId
                type: FromFieldPath
                fromFieldPath: status.atProvider.vpcId

          # Pre-defined rule resources 0-19 - array index patching with Optional policy skips unused slots
          # Provider reference resolution requires verification - see design.md 'Security Group Reference Resolution' section

          # Ingress Rule 0
          - name: ingress-rule-0
            base:
              apiVersion: ec2.aws.upbound.io/v1beta1
              kind: SecurityGroupRule
              spec:
                forProvider:
                  type: ingress
                  securityGroupIdSelector:
                    matchControllerRef: true
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: spec.parameters.ingressRules[0].protocol
                toFieldPath: spec.forProvider.protocol
                policy:
                  fromFieldPath: Optional
              - type: FromCompositeFieldPath
                fromFieldPath: spec.parameters.ingressRules[0].fromPort
                toFieldPath: spec.forProvider.fromPort
                policy:
                  fromFieldPath: Optional
              - type: FromCompositeFieldPath
                fromFieldPath: spec.parameters.ingressRules[0].toPort
                toFieldPath: spec.forProvider.toPort
                policy:
                  fromFieldPath: Optional
              - type: FromCompositeFieldPath
                fromFieldPath: spec.parameters.ingressRules[0].cidrBlocks
                toFieldPath: spec.forProvider.cidrBlocks
                policy:
                  fromFieldPath: Optional
              - type: FromCompositeFieldPath
                fromFieldPath: spec.parameters.ingressRules[0].ipv6CidrBlocks
                toFieldPath: spec.forProvider.ipv6CidrBlocks
                policy:
                  fromFieldPath: Optional
              - type: FromCompositeFieldPath
                fromFieldPath: spec.parameters.ingressRules[0].sourceSecurityGroupId
                toFieldPath: spec.forProvider.sourceSecurityGroupId
                policy:
                  fromFieldPath: Optional
              - type: FromCompositeFieldPath
                fromFieldPath: spec.parameters.ingressRules[0].description
                toFieldPath: spec.forProvider.description
                policy:
                  fromFieldPath: Optional
              - type: PatchSet
                patchSetName: provider-config
              - type: PatchSet
                patchSetName: region

          # Ingress Rule 1
          - name: ingress-rule-1
            base:
              apiVersion: ec2.aws.upbound.io/v1beta1
              kind: SecurityGroupRule
              spec:
                forProvider:
                  type: ingress
