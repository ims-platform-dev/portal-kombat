---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: workload-monitoring
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: applications-project
  source:
    repoURL: git@github.com:ims-platform-dev/portal-kombat.git
    targetRevision: HEAD
    path: workloads/monitoring
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
    syncOptions:
    - CreateNamespace=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: workload-s3reader
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: applications-project
  source:
    repoURL: git@github.com:ims-platform-dev/portal-kombat.git
    targetRevision: HEAD
    path: workloads/s3reader
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true    