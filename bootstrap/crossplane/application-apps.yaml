---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: workload-apps 
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io  
spec:
  project: applications-project
  source:
    repoURL: https://github.com/ims-platform-dev/portal-kombat.git
    targetRevision: HEAD
    path: workloads
    helm:
      values: |
        spec:
          destination:
            server: https://31F74548D0C0D4910526F1FBE62C72B5.gr7.us-east-2.eks.amazonaws.com
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true    