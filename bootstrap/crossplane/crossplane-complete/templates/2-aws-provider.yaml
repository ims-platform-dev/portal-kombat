---
apiVersion: pkg.crossplane.io/v1beta1
kind: DeploymentRuntimeConfig
metadata:
  name: aws-config
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  deploymentTemplate:
    metadata:
      annotations:
        eks.amazonaws.com/role-arn: arn:aws:iam::654654563406:role/crossplane-sa-role
    spec:
      selector: {}
      template:
        spec:
          securityContext:
            fsGroup: 2000

---
apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: crossplane-provider-aws
  annotations:
    argocd.argoproj.io/sync-wave: "20"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  package: xpkg.upbound.io/crossplane-contrib/provider-aws:v0.35.0
  runtimeConfigRef:
    name: aws-config    
    
---
apiVersion: batch/v1
kind: Job
metadata:
  generateName: after-aws-provider
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "30"
spec:
  template:
    spec:
      containers:
        - name: page-down
          image: alpine:latest
          command: ["sleep", "10"]
      restartPolicy: Never
