apiVersion: pkg.crossplane.io/v1
kind: Configuration
metadata:
  name: crossplane-eks-composition
  annotations:
    argocd.argoproj.io/sync-wave: "410"   
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  ignoreCrossplaneConstraints: false
  package: 654654563406.dkr.ecr.us-east-2.amazonaws.com/crossplane-eks-composition:15.6.0  
  packagePullPolicy: IfNotPresent
  revisionActivationPolicy: Automatic
  revisionHistoryLimit: 0
  skipDependencyResolution: false

---
apiVersion: batch/v1
kind: Job
metadata:
  generateName: post-configuration
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "420"
spec:
  template:
    spec:
      containers:
        - name: page-down
          image: alpine:latest
          command: ["sleep", "20"]
      restartPolicy: Never