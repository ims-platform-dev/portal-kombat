---
# Crossplane configuration values
crossplane:
  # Enable Crossplane installation
  enabled: true

  # Resource requests and limits
  resourcesCrossplane:
    limits:
      cpu: 100m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi

  # RBAC provider configuration
  rbacManager:
    deploy: true
    managementPolicy: All

  # Enable webhooks
  webhooks:
    enabled: true

# AWS Provider configuration
aws:
  accountId: "654654563406"
  region: "us-east-2"
  roleArn: "arn:aws:iam::654654563406:role/crossplane-sa-role"

# EKS Cluster configuration
eks:
  region: "us-west-2"
  accountId: "654654563406"
  clusterRole: "arn:aws:iam::654654563406:role/EKS-Cluster-Role"
  workerNodeRole: "arn:aws:iam::654654563406:role/EKS-WorkerNode-Role"
  version: "1.24"

# Provider images
providers:
  aws:
    version: "v0.35.0"
  kubernetes:
    registry: "654654563406.dkr.ecr.us-east-2.amazonaws.com"
    image: "crossplane-k8s-provider"
    tag: "v0.4.1"
  composition:
    registry: "654654563406.dkr.ecr.us-east-2.amazonaws.com"
    image: "crossplane-eks-composition"
    tag: "15.6.0"
